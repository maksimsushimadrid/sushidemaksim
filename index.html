<!doctype html>
<html lang="es">
    <head>
        <script>
            // --- IMMEDIATE THEME SETUP ---
            // Fix white flash on refresh by setting background color immediately
            (function () {
                // --- CANONICAL REDIRECT ---
                const host = window.location.hostname;
                const isProduction = host !== 'localhost' && !host.includes('vercel.app');
                if (isProduction && host === 'sushidemaksim.com') {
                    window.location.replace(
                        'https://www.sushidemaksim.com' +
                            window.location.pathname +
                            window.location.search +
                            window.location.hash
                    );
                    return;
                }

                const isTable = window.location.pathname.startsWith('/table');
                const isDark = isTable;
                const bgColor = isDark ? '#0d0d0d' : '#fbf7f0';
                const themeColor = isDark ? '#000000' : '#ea580c';

                document.documentElement.style.backgroundColor = bgColor;
                if (isDark) {
                    document.documentElement.style.colorScheme = 'dark';
                    document.documentElement.classList.add('is-table-route');
                }

                // Update theme-color meta tag if it exists
                document.addEventListener('DOMContentLoaded', function () {
                    const meta = document.querySelector('meta[name="theme-color"]');
                    if (meta) meta.setAttribute('content', themeColor);
                });
            })();
        </script>
        <!-- Google tag (gtag.js) -->

        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag() {
                dataLayer.push(arguments);
            }
            gtag('js', new Date());

            gtag('config', 'AW-18147561987');
        </script>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="preconnect" href="https://lmuytpvktanykcubpodh.supabase.co" />

                background-color: #0d0d0d !important;
                color-scheme: dark;

    <body>
        <div id="root">
            <!-- Critical paint placeholder for LCP optimization (only visible on homepage /) -->
            <div
                id="lcp-background-placeholder"
                style="
                    position: fixed;
                    inset: 0;
                    background-color: #0d0d0d;
                    z-index: 0;
                    display: none;
                    width: 100vw;
                    height: 100vh;
                    overflow: hidden;
                    pointer-events: none;
                "
            >
                <div
                    style="
                        position: absolute;
                        inset: 0;
                        z-index: 10;
                        background: linear-gradient(
                            to bottom,
                            rgba(0, 0, 0, 0.7) 0%,
                            rgba(0, 0, 0, 0.55) 40%,
                            rgba(0, 0, 0, 0.75) 100%
                        );
                    "
                ></div>
                <picture>
                    <source media="(max-width: 768px)" srcset="/hero-poster-mobile.webp" />
                    <img
                        src="/hero-poster.webp"
                        style="
                            position: absolute;
                            inset: 0;
                            width: 100%;
                            height: 100%;
                            object-fit: cover;
                        "
                        alt="Sushi background"
                    />
                </picture>
            </div>
            <script>
                if (window.location.pathname === '/' || window.location.pathname === '') {
                    document.getElementById('lcp-background-placeholder').style.display = 'block';
                }
            </script>
        </div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
